[package]
name = "crabdis"
description = "It's like Redis but a bit rusty..."
license = "MIT"
repository = "https://github.com/pxseu/crabdis"
readme = "README.md"
homepage = "https://github.com/pxseu/crabdis#readme"
version = "0.1.26"
edition = "2024"

[dependencies]
log = "0.4"
fern = "0.7"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full", "tracing"] }
async-trait = "0.1"
glob = "0.3"

[profile.release]
strip = true
lto = true
opt-level = 3
panic = "abort"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1.38", features = ["full", "tracing"] }

[[bench]]
name = "value_benchmarks"
harness = false

[[bench]]
name = "int_parser"
harness = false
