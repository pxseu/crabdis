name: Test

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  fmt:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest

          - target: x86_64-apple-darwin
            os: macOS-latest

          - target: aarch64-apple-darwin
            os: macOS-latest

          - target: x86_64-pc-windows-msvc
            os: windows-latest

          # cant test arm64 windows on github actions
          # - target: aarch64-pc-windows-msvc
          #   os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install Cross [Linux]
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cross

      - name: Run Clippy
        run: ${{ matrix.os == 'ubuntu-latest' && 'cross' || 'cargo' }} clippy --locked --target ${{ matrix.target }} --profile test --all-features -- -D warnings

      - name: Run tests
        run: ${{ matrix.os == 'ubuntu-latest' && 'cross' || 'cargo' }} test --locked --target ${{ matrix.target }}
